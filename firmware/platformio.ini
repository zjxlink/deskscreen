; 桌面信息屏固件
; 编译并烧录到 ESP32-S3-BOX-3：pio run -e box3 -t upload
; 查看串口日志：pio device monitor

[platformio]
default_envs = box3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = post:tools/merge_bin.py
lib_deps =
  lovyan03/LovyanGFX@1.1.16
  lvgl/lvgl@8.3.11
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I include
  -D CORE_DEBUG_LEVEL=3

; 开发板：乐鑫 ESP32-S3-BOX-3（2.4 寸 ILI9342C，320x240）
[env:box3]
board = esp32s3box
board_build.partitions = default_16MB.csv
build_flags =
  ${env.build_flags}
  -D BOARD_BOX3

; 量产板：自己画的 PCB（2.0 寸 ST7789，240x320 横屏使用）
; 模组按 ESP32-S3-WROOM-1-N8R2（8MB Flash + 2MB PSRAM）配置，引脚见 include/board.h
[env:desk_v1]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -D BOARD_DESK_V1
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
