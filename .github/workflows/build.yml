name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [box3, desk_v1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
          # platformio.ini 改了也先用旧缓存，只补下载缺的包；PlatformIO 的下载源偶尔会超时
          restore-keys: pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install platformio==6.1.16

      - name: Build
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}

      - name: Check firmware images
        working-directory: firmware/.pio/build/${{ matrix.env }}
        run: python3 ../../../tools/check_image.py firmware.bin firmware-merged.bin

      # firmware-merged.bin 用网页工具烧到 0x0；firmware.bin 用于设置页面上传升级
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/firmware-merged.bin
            firmware/.pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-native-

      - name: Install PlatformIO
        run: pip install platformio==6.1.16

      - name: Unit tests
        working-directory: firmware
        run: pio test -e native
